# Modules 2 and 3: conda-forge, every main library pinned to the versions the notebooks last ran with.
#   conda env create -f course/environment.yml && conda activate ncar-ml-readiness
name: ncar-ml-readiness
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - jupyterlab=4.6.4
  - ipykernel=7.4.0
  - nbconvert=7.17.2
  - nbformat=5.11.1
  - numpy=2.5.4
  - pandas=3.0.6
  - scipy=1.18.1
  - scikit-learn=1.9.1
  - matplotlib=3.11.2
  - xarray=2026.9.0
  - zarr=3.4.1
  - s3fs=2026.9.0
  - cftime=1.6.5
  - intake=2.0.9
  - intake-esm=2025.12.12
  - keras=3.15.1
  - pytorch=2.14.1
